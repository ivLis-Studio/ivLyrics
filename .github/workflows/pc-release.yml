name: PC Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without v (for example 7.2.0)"
        required: true
        type: string
      prerelease:
        description: "Publish as a prerelease"
        type: boolean
        default: false
      notify_discord:
        description: "Send release notes to Discord after publishing"
        type: boolean
        default: false
      dry_run:
        description: "Build, test and upload Actions artifacts only"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ inputs.dry_run && 'pc-release-preview' || 'pc-release' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      sha: ${{ steps.source.outputs.sha }}
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
      package_sha256: ${{ steps.archive.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select release source
        id: source
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: bash .github/scripts/pc_release.sh select-source

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build and test the install archive
        id: archive
        env:
          VERSION: ${{ inputs.version }}
        run: |
          npm run package -- --version "$VERSION"
          package_checksum="$(sha256sum dist/ivLyrics.zip)"
          IVLYRICS_TEST_PACKAGE_VERSION="$VERSION" npm test
          test "$package_checksum" = "$(sha256sum dist/ivLyrics.zip)"
          printf 'sha256=%s\n' "${package_checksum%% *}" >> "$GITHUB_OUTPUT"

      - name: Preview release notes
        if: ${{ inputs.dry_run }}
        id: notes
        continue-on-error: true
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ steps.source.outputs.tag }}
          RELEASE_SHA: ${{ steps.source.outputs.sha }}
          RELEASE_NOTES_USE_RELEASE_HISTORY: "true"
          PRERELEASE: ${{ inputs.prerelease }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES_DIR: ${{ runner.temp }}/release-metadata
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          AI_TIMEOUT_SECONDS: "300"
          RELEASE_NOTES_REQUIRE_AI: "false"
        run: python3 .github/scripts/generate_release_notes.py

      - name: Upload tested release artifact
        id: artifact
        uses: actions/upload-artifact@v7
        with:
          name: ivLyrics-${{ steps.source.outputs.tag }}-attempt-${{ github.run_attempt }}
          path: |
            dist/ivLyrics.zip
            dist/ivLyrics.zip.sha256
            ${{ steps.notes.outputs.notes_path }}
            ${{ steps.notes.outputs.metadata_path }}
          if-no-files-found: error
          retention-days: ${{ inputs.dry_run && 14 || 30 }}

  windows-validation:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.build.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: release-artifact

      - name: Test the Windows installer with the release ZIP
        env:
          IVLYRICS_TEST_PACKAGE_VERSION: ${{ inputs.version }}
          RELEASE_PACKAGE_SHA256: ${{ needs.build.outputs.package_sha256 }}
        run: |
          $archives = @(Get-ChildItem -LiteralPath release-artifact -Filter ivLyrics.zip -Recurse -File)
          if ($archives.Count -ne 1 -or (Get-FileHash -LiteralPath $archives[0].FullName).Hash -ine $env:RELEASE_PACKAGE_SHA256) {
            throw 'The downloaded archive does not match the tested ZIP.'
          }
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item -LiteralPath $archives[0].FullName -Destination dist/ivLyrics.zip
          node --test tests/windows_installer_upgrade.test.mjs

  macos-validation:
    needs: build
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.build.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: release-artifact

      - name: Test the macOS installer with the release ZIP
        shell: /bin/bash {0}
        env:
          IVLYRICS_TEST_PACKAGE_VERSION: ${{ inputs.version }}
          RELEASE_PACKAGE_SHA256: ${{ needs.build.outputs.package_sha256 }}
        run: |
          set -euo pipefail
          archive="$(find release-artifact -type f -name ivLyrics.zip)"
          if [[ -z "$archive" || "$archive" == *$'\n'* ]]; then
            echo 'Expected one release ZIP.' >&2
            exit 1
          fi
          checksum="$(shasum -a 256 "$archive")"
          test "${checksum%% *}" = "$RELEASE_PACKAGE_SHA256"
          mkdir -p dist
          cp "$archive" dist/ivLyrics.zip
          PATH="/usr/bin:/bin:$PATH" node --test tests/unix_installer_upgrade.test.mjs

  publish:
    needs: [build, windows-validation, macos-validation]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.build.outputs.tag }}
      RELEASE_SHA: ${{ needs.build.outputs.sha }}
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_PACKAGE_SHA256: ${{ needs.build.outputs.package_sha256 }}
      PRERELEASE: ${{ inputs.prerelease }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.build.outputs.sha }}
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: release-artifact

      - name: Prepare release notes
        id: notes
        env:
          RELEASE_NOTES_REUSE_PUBLISHED: "true"
          RELEASE_NOTES_USE_RELEASE_HISTORY: "true"
          RELEASE_NOTES_DIR: release-artifact/notes
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          AI_TIMEOUT_SECONDS: "300"
          RELEASE_NOTES_REQUIRE_AI: "true"
        run: python3 .github/scripts/generate_release_notes.py

      - name: Publish tested archive
        id: publish
        env:
          RELEASE_TITLE: ${{ steps.notes.outputs.release_title }}
        shell: bash
        run: bash .github/scripts/pc_release.sh publish

      - name: Advance the stable update marker
        if: ${{ !inputs.prerelease }}
        shell: bash
        run: bash .github/scripts/pc_release.sh advance-update-marker

      - name: Send PC release notes to Discord
        if: ${{ inputs.notify_discord && steps.publish.outputs.published == 'true' }}
        env:
          RELEASE_WEBHOOK_URL: ${{ secrets.RELEASE_NOTES_WEBHOOK_URL }}
          RELEASE_PLATFORM: pc
          RELEASE_NOTES_PATH: ${{ steps.notes.outputs.notes_path }}
        run: node .github/scripts/send_release_webhook.mjs
