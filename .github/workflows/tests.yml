name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check script syntax
        run: |
          for f in *.js langs/*.js mobile/motion/*.js .github/scripts/*.mjs; do
            node --check "$f"
          done

      - name: Run tests
        run: node --test tests/*.test.mjs
