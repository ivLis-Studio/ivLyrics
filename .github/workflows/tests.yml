name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # Some tests compare against earlier commits with git show.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Check script syntax
        run: |
          find src .github/scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n 1 node --check

      - name: Build and test the install archive
        run: |
          npm run package
          IVLYRICS_TEST_PACKAGE_VERSION="$(cat version.txt)" npm test

  windows-installer:
    name: Windows installer and archive
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Test the Windows installer with the packaged archive
        run: |
          npm run package
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:IVLYRICS_TEST_PACKAGE_VERSION = (Get-Content -Raw version.txt).Trim()
          node --test tests/windows_installer_upgrade.test.mjs tests/release_archive_contents.test.mjs
